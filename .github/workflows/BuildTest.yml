# This is the name of the workflow, visible on GitHub UI.
name: 'Build tests'

# Controls when the action will run. 
# Here we tell GitHub to run the workflow when a commit.
on: 
  push:
  pull_request:

  # Scheduled the first day of every month at 00:00h UTC
  schedule:
    - cron:  '0 0 1 * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
  
    # This is the name of the job
    name: 'Build on ${{ matrix.platform }} using Python ${{ matrix.python-version }}'

    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows, Linux or Mac. 
    runs-on: ${{ matrix.platform }}

    # Here we tell GitHub that the jobs must be determined
    # dynamically depending on a matrix configuration.
    strategy:
      
      # Set to false so that GitHub does not cancel all jobs
      # in progress if any array job fails.
      fail-fast: false

      # The matrix will produce one job for each configuration:
      matrix:
        platform: [windows-2022, windows-latest, macos-15-intel, macos-latest, ubuntu-latest]
        python-version: ["3.8", "3.11", "3.13"]
        exclude:
          - platform: macos-latest
            python-version: "3.8"

    # This is the list of steps this job will run.
    steps:
        # Clone repo using the checkout action.
      - name: Checkout with recursive submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

        # Install Python version from matrix.
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

        # Install Python requirements for module build.
      - name: Add Python requirements for module build
        run: python -m pip install --upgrade pip wheel setuptools

        # Build and install pyPiCode Python module.
      - name: Build and install Python module
        run: python -m pip install -v --user .

        # Test pyPiCode Python module.
      - name: Run unit test Python module
        run: python -m unittest discover -v

        # Run pyPiCode example code.
      - name: Run pyPiCode example
        run: python pypicode_example.py